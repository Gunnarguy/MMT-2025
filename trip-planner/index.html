<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚙</text></svg>"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Michigan road trip field guide — September 14–21, 2026. Palatine to the Straits of Mackinac and back, by way of Ontario."
    />
    <meta name="theme-color" content="#0f2733" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Michigan '26" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <title>Michigan '26 — Field Guide</title>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-mark">MI</div>
        <div class="boot-text">Loading the field guide…</div>
      </div>
    </div>
    <style>
      .boot {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100dvh;
        gap: 1rem;
        background: #0f2733;
        color: #cfe3ea;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      .boot-mark {
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: 0.3em;
        padding: 0.6rem 0.9rem;
        border: 2px solid #3f7f92;
        border-radius: 10px;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      .boot-text {
        font-size: 0.9rem;
        opacity: 0.6;
        letter-spacing: 0.02em;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
